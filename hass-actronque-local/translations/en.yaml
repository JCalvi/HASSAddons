configuration:
  master_ip:
    name: QUE master IP
    description: IP address of the QUE master wall controller. For multiple independent QUE systems, enter the master IP addresses as a comma-separated list.
  master_port:
    name: WallLink TCP port
    description: Native QUE WallLink TCP port. Normally 19296.
  serial:
    name: Synthetic secondary serial
    description: Serial used by Home Assistant as the synthetic secondary controller. For multiple QUE systems, enter matching synthetic serials as a comma-separated list in the same order as the master IPs. Missing additional serials are generated automatically.
  auto_secondary_setup:
    name: Automatic secondary setup
    description: Automatically guide and perform the one-time synthetic secondary pairing process when required.
  existing_secondary_serial:
    name: Existing secondary serial
    description: Optional serial of a real secondary controller. For multiple QUE systems, enter matching serials as a comma-separated list in the same order as the master IPs. Leave blank where automatic detection should be used.
  max_secondary_controllers:
    name: Maximum secondary controllers
    description: Value used for NV_SystemSettings.MaxSecondaryControllers. Normally 2 so Home Assistant and one physical secondary can coexist.
  setup_retry_delay:
    name: Setup retry delay
    description: Seconds between guided setup retry attempts while waiting for controller setup steps.
  separate_heat_cool_targets:
    name: Separate Heat/Cool Targets
    description: Use independent heating and cooling targets on climate entities instead of a single target temperature.
  topic_prefix:
    name: MQTT topic prefix
    description: Root MQTT topic used internally by this app.
  discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT Discovery prefix.
  reconnect_delay:
    name: Reconnect delay
    description: Seconds between WallLink reconnect attempts.
  socket_timeout:
    name: WallLink receive timeout
    description: Seconds without WallLink traffic before reconnecting.
  log_data_changes:
    name: Log Data_Change messages
    description: Log incoming WallLink Data_Change payloads.
  publish_raw_state:
    name: Publish complete state
    description: Publish the full current QUE state to MQTT.
  log_level:
    name: Log level
    description: App logging verbosity.
