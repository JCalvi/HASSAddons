# Rekognition Bridge: event-driven, notification-only example.
# Load the named package from hass_rekognition.yaml first (REST command/token).
# This file has a top-level automation: key. Merge its list into your existing
# automation configuration; do not create a second automation: key.
# Replace entities/notify target and create the /media/snapshots directory.
# Permit camera.snapshot to write there in Home Assistant if required.
# Both triggers share one camera, one request stream and one cooldown.
# Keep either trigger or both. No timer, repeated-frame upload or access control.
automation:
  - id: rekognition_front_door_notification
    alias: "Rekognition – Front Door Notification"
    description: >-
      On a person event or doorbell press, capture one snapshot and use only
      the current request's validated result for a recognition hint notification.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_person
        from: "off"
        to: "on"
      - trigger: state
        entity_id: binary_sensor.front_doorbell
        from: "off"
        to: "on"
    conditions:
      # Backstop if an earlier run stopped before the final cooldown delay.
      - condition: template
        value_template: >-
          {{ (as_timestamp(now()) -
              as_timestamp(this.attributes.get('last_triggered'), 0)) >= 10 }}
    actions:
      - variables:
          similarity_threshold: 95
          snapshot_file: /media/snapshots/rekognition_front_door_latest.jpg
          # Fresh for every run; a failed REST action cannot reuse an old result.
          rekognition_result: {}
      # Stop on snapshot failure: never upload the previous run's file instead.
      - action: camera.snapshot
        target:
          entity_id: camera.front_door
        data:
          filename: "{{ snapshot_file }}"
      - action: rest_command.rekognition_match_person
        data:
          snapshot_path: "{{ snapshot_file }}"
          threshold: "{{ similarity_threshold }}"
        response_variable: rekognition_result
        # A timeout may produce no response. Empty/non-JSON/error output cannot
        # satisfy the matched branch below. Continue to the cooldown on failure.
        continue_on_error: true
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set response = rekognition_result | default({}, true) %}
                  {% set body = response.get('content') if response is mapping else none %}
                  {{ response is mapping
                     and (response.get('status') | int(0)) == 200
                     and body is mapping
                     and body.get('status') == 'matched'
                     and body.get('matched') is sameas true
                     and body.get('name') is string
                     and body.get('name') | trim | length > 0
                     and (body.get('similarity') | float(-1)) >= similarity_threshold
                     and (body.get('similarity') | float(-1)) <= 100 }}
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "Front door – possible known visitor"
                  message: >-
                    {{ rekognition_result['content']['name'] | replace('_', ' ') }}
                    (similarity {{ rekognition_result['content']['similarity'] }}%).
                    Recognition hint only; check the camera before acting.
                continue_on_error: true
        default:
          # Includes no_match, no_face, HTTP errors, malformed responses and
          # timeouts. No matched-person notification or protected action runs.
          - action: system_log.write
            data:
              message: >-
                Rekognition did not return a validated current match;
                no matched-person action was performed.
              level: warning
            continue_on_error: true
      # Ignore further events while running and for 10 seconds after processing.
      # Tune for your event rate; this is not a daily quota or spending cap.
      - delay: "00:00:10"
