configuration:
  local_ip:
    name: Home Assistant LAN IP
    description: LAN IP address of the Home Assistant host that the NEO controller can reach. This address is returned to the controller as its local MQTT endpoint.
  nimbus_user_id:
    name: Nimbus User ID (optional)
    description: Advanced override only. Normally leave blank. The add-on learns the real Actron/Nimbus User ID automatically from each NEO's native MQTT topic after it connects; when blank, a private persistent local UUID is used only for the Nimbus bootstrap response.
  neo_mqtt_port:
    name: NEO MQTT port
    description: Host TCP port advertised to NEO controllers for local TLS MQTT. The add-on Network host port for container port 8883 must match this value. Default 28883 avoids the standard Mosquitto 8883 port.
  nimbus_account_delay_ip:
    name: Nimbus account delay target IP
    description: Diagnostic only. If set, delay only /client/account responses from this NEO source IP. Leave blank for normal operation.
  nimbus_account_delay_seconds:
    name: Nimbus account delay seconds
    description: Diagnostic only. Number of seconds to hold the targeted /client/account response. Set to 0 for normal operation.
  topic_prefix:
    name: MQTT topic prefix
    description: Root MQTT topic used by the add-on for normalized state and Home Assistant command topics.
  discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT Discovery prefix. The normal value is homeassistant.
  publish_raw_state:
    name: Publish raw NEO state
    description: Retain the complete decoded NEO state under the add-on topic prefix for diagnostics.
  log_level:
    name: Log level
    description: Add-on logging verbosity.
