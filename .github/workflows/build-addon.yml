name: Build Home Assistant Add-on

on:
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on to build
        required: true
        type: choice
        options:
          - actronque-cloud
          - actronque-local
          - actronneo-localcloud
          - networkexplorer
          - rekognition

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.addon }} / ${{ matrix.ha_arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            platform: linux/amd64
          - ha_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select add-on and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.addon }}" in
            actronque-cloud)
              ADDON_PATH="hass-actronque-cloud"
              IMAGE_NAME="hass-actronque"
              CONFIG_FILE="hass-actronque-cloud/config.json"
              VERSION="$(jq -r '.version' "$CONFIG_FILE")"
              BUILD_ARGS=""
              ;;

            actronque-local)
              ADDON_PATH="hass-actronque-local"
              IMAGE_NAME="hass-actronque-local"
              CONFIG_FILE="hass-actronque-local/config.yaml"
              VERSION="$(grep -m1 '^version:' "$CONFIG_FILE" | cut -d: -f2- | xargs | tr -d '"')"
              BUILD_ARGS=""
              ;;

            actronneo-localcloud)
              ADDON_PATH="hass-actronneo-localcloud"
              IMAGE_NAME="hass-actronneo-localcloud"
              CONFIG_FILE="hass-actronneo-localcloud/config.yaml"
              VERSION="$(grep -m1 '^version:' "$CONFIG_FILE" | cut -d: -f2- | xargs | tr -d '"')"
              BUILD_ARGS=""
              ;;

            networkexplorer)
              ADDON_PATH="hass-networkexplorer"
              IMAGE_NAME="hass-networkexplorer"
              CONFIG_FILE="hass-networkexplorer/config.yaml"
              VERSION="$(grep -m1 '^version:' "$CONFIG_FILE" | cut -d: -f2- | xargs | tr -d '"')"

              if [ "${{ matrix.ha_arch }}" = "amd64" ]; then
                BUILD_FROM="ghcr.io/home-assistant/amd64-base:latest"
              else
                BUILD_FROM="ghcr.io/home-assistant/aarch64-base:latest"
              fi

              BUILD_ARGS="BUILD_FROM=${BUILD_FROM}"
              ;;

            rekognition)
              ADDON_PATH="hass-rekognition"
              IMAGE_NAME="hass-rekognition"
              CONFIG_FILE="hass-rekognition/config.json"
              VERSION="$(jq -r '.version' "$CONFIG_FILE")"
              BUILD_ARGS=""
              ;;

            *)
              echo "Unknown add-on: ${{ inputs.addon }}"
              exit 1
              ;;
          esac

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not determine version from $CONFIG_FILE"
            exit 1
          fi

          echo "path=$ADDON_PATH" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_args=$BUILD_ARGS" >> "$GITHUB_OUTPUT"

          echo "Building $IMAGE_NAME version $VERSION for ${{ matrix.ha_arch }}"

      - name: Set ActronQue build date
        if: inputs.addon == 'actronque-cloud'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DATE_FILE="hass-actronque-cloud/hass-actronque-cloud/Resources/BuildDate.txt"
          date '+%a %d/%m/%Y' > "$BUILD_DATE_FILE"
          echo "Updated $BUILD_DATE_FILE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: jcrfc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.path }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ steps.meta.outputs.build_args }}
          tags: |
            jcrfc/${{ steps.meta.outputs.image }}-${{ matrix.ha_arch }}:latest
            jcrfc/${{ steps.meta.outputs.image }}-${{ matrix.ha_arch }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.addon }}-${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.addon }}-${{ matrix.ha_arch }}


      - name: Prune old Docker Hub tags
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          NAMESPACE="jcrfc"
          REPOSITORY="${{ steps.meta.outputs.image }}-${{ matrix.ha_arch }}"
          KEEP_VERSION_TAGS=3

          echo "Pruning ${NAMESPACE}/${REPOSITORY}: keeping latest + ${KEEP_VERSION_TAGS} newest version tags"

          AUTH_RESPONSE="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc \
              --arg identifier "$NAMESPACE" \
              --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}')" \
            'https://hub.docker.com/v2/auth/token')"

          HUB_TOKEN="$(jq -r '.access_token // empty' <<<"$AUTH_RESPONSE")"
          if [ -z "$HUB_TOKEN" ]; then
            echo "Docker Hub authentication succeeded but no access token was returned."
            exit 1
          fi

          TAG_FILE="$(mktemp)"
          DELETE_RESPONSE="$(mktemp)"
          trap 'rm -f "$TAG_FILE" "$DELETE_RESPONSE"' EXIT

          URL="https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${REPOSITORY}/tags?page_size=100"

          while [ -n "$URL" ]; do
            PAGE="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${HUB_TOKEN}" \
              --header 'Accept: application/json' \
              "$URL")"

            jq -c '.results[]' <<<"$PAGE" >> "$TAG_FILE"
            URL="$(jq -r '.next // empty' <<<"$PAGE")"
          done

          mapfile -t OLD_TAGS < <(
            jq -s -r --argjson keep "$KEEP_VERSION_TAGS" '
              map(select(.name != "latest"))
              | sort_by(.tag_last_pushed // .last_updated // "")
              | reverse
              | .[$keep:]
              | .[].name
            ' "$TAG_FILE"
          )

          if [ "${#OLD_TAGS[@]}" -eq 0 ]; then
            echo "Nothing to delete."
            exit 0
          fi

          for TAG in "${OLD_TAGS[@]}"; do
            ENCODED_TAG="$(jq -rn --arg value "$TAG" '$value | @uri')"

            HTTP_STATUS="$(curl --silent --show-error \
              --output "$DELETE_RESPONSE" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${HUB_TOKEN}" \
              "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPOSITORY}/tags/${ENCODED_TAG}/")"

            case "$HTTP_STATUS" in
              200|202|204)
                echo "Deleted old tag: ${TAG}"
                ;;
              *)
                echo "::warning::Failed to delete tag ${TAG} (HTTP ${HTTP_STATUS}). Docker image build/push succeeded; cleanup will be skipped."
                cat "$DELETE_RESPONSE"
                echo
                if [ "$HTTP_STATUS" = "403" ]; then
                  echo "::warning::DOCKERHUB_TOKEN does not have Delete permission. Create a Docker Hub PAT with Delete access and replace the GitHub DOCKERHUB_TOKEN secret."
                fi
                exit 0
                ;;
            esac
          done
